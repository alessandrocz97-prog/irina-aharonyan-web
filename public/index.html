<style>
/* ==========================================================================
   Irina Aharonyan · Abogada penalista
   ========================================================================== */
:root {
  color-scheme: light;
  /* Color */
  --ivory: #F8F5EF;        /* fondo de página */
  --porcelain: #FDFCFA;    /* superficies elevadas */
  --linen: #F0EAE0;        /* bandas */
  --ink: #262321;          /* texto y trazos */
  --ink-2: #514A43;        /* texto secundario */
  --ink-3: #766C62;        /* metadatos */
  --bronze: #8A6748;       /* acento: filetes, iconos, estados */
  --bronze-deep: #6B4E36;  /* acento sobre texto pequeño */
  --bronze-soft: #C2A98F;
  --line: rgba(38, 35, 33, .13);
  --line-strong: rgba(38, 35, 33, .34);
  --danger: #8C2F1F;
  /* Tipografía */
  --display: "Cormorant Garamond", "Noto Serif Armenian", Georgia, "Times New Roman", serif;
  --text: "EB Garamond", "Noto Serif Armenian", Georgia, "Times New Roman", serif;
  --k: 1;                  /* corrección de cuerpo por alfabeto */
  /* Movimiento y medida */
  --ease: cubic-bezier(.23, 1, .32, 1);
  --wrap: 1200px;
  --gutter: clamp(20px, 4.2vw, 56px);
  --bar-h: 66px;
  /* Composición: cabecera clásica centrada en la portada; después, contenido alineado a la
     izquierda sobre una retícula de 12 columnas ordenada con filetes finos. */
}
html[lang="ru"] { --k: .9; }
html[lang="hy"] { --k: .74; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--bar-h) + 20px); }
html.menu-open { overflow: hidden; }
body {
  margin: 0;
  background: var(--ivory);
  color: var(--ink);
  font-family: var(--text);
  font-size: 1.1875rem;
  line-height: 1.6;
  font-variant-numeric: lining-nums;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
img { max-width: 100%; height: auto; display: block; }
a { color: inherit; }
p { margin: 0 0 1em; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; line-height: 1.1; margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--bronze-deep); outline-offset: 3px; border-radius: 2px; }
#app:focus { outline: none; }
svg.ic, svg.ui { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.ic { stroke-width: 1.25; width: 34px; height: 34px; }
svg.ui { stroke-width: 1.4; width: 18px; height: 18px; }
/* Cifras alineadas en todo el sitio: la propiedad abreviada `font` las restablece en cada regla. */
*, *::before, *::after { font-variant-numeric: lining-nums !important; }
.day, .slot, .sum dd { font-variant-numeric: lining-nums tabular-nums !important; }

.skip { position: absolute; left: 16px; top: -60px; z-index: 100; background: var(--ink); color: var(--ivory); padding: 10px 16px; border-radius: 6px; text-decoration: none; font-size: 1rem; }
.skip:focus { top: 12px; }

/* ---------- Primitivas ---------- */
.wrap { width: 100%; max-width: calc(var(--wrap) + 2 * var(--gutter)); margin-inline: auto; padding-inline: var(--gutter); }
.section { padding-block: clamp(56px, 7.5vw, 108px); }
.section--linen { background: var(--linen); }
.rule { display: block; width: 92px; height: 1px; background: var(--bronze); }

.h-display { font-style: italic; font-size: calc(var(--k) * clamp(2.6rem, 5.5vw, 4.8rem)); line-height: 1.02; letter-spacing: -.01em; }
.h-page { font-style: italic; font-size: calc(var(--k) * clamp(2.5rem, 4.8vw, 4.1rem)); line-height: 1.04; letter-spacing: -.005em; }
.h-section { font-style: italic; font-size: calc(var(--k) * clamp(2rem, 3.3vw, 2.9rem)); }
html[lang="hy"] .h-display { font-size: clamp(1.75rem, 3.1vw, 2.75rem); font-weight: 400; }
html[lang="hy"] .h-page { font-size: clamp(1.8rem, 3.3vw, 2.9rem); font-weight: 400; }
html[lang="hy"] .h-display, html[lang="hy"] .h-page, html[lang="hy"] .h-section,
html[lang="hy"] .urgent h2, html[lang="hy"] .cta h2, html[lang="hy"] .menu nav a,
html[lang="hy"] .about__text p:first-child { font-style: normal; letter-spacing: 0; line-height: 1.18; }

.label { font: 500 .8125rem/1.3 var(--text); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }

.ruled { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 3vw, 36px); text-align: center; }
.ruled::before, .ruled::after { content: ""; flex: 1; max-width: 120px; height: 1px; background: var(--line-strong); }
.ruled span { font-family: var(--display); font-weight: 500; font-size: calc(var(--k) * clamp(1.1rem, 2vw, 1.6rem)); letter-spacing: .14em; text-transform: uppercase; }

.shead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 32px; flex-wrap: wrap; margin-bottom: clamp(26px, 3.4vw, 44px); }
.shead--stack { display: block; }
.shead--stack p { margin: .6em 0 0; color: var(--ink-2); max-width: 36em; }

/* ---------- Botones y enlaces ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .75em;
  min-height: 52px; padding: 0 1.55em;
  border: 1px solid var(--ink); border-radius: 8px; background: transparent; color: var(--ink);
  font: 500 .82rem/1.15 var(--text); letter-spacing: .14em; text-transform: uppercase; text-decoration: none; text-align: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background-color .2s ease, color .2s ease, border-color .2s ease, transform .16s var(--ease);
}
.btn:active { transform: scale(.97); }
.btn--solid { background: var(--ink); color: var(--ivory); }
.btn--light { border-color: rgba(248, 245, 239, .55); color: var(--ivory); }
.btn--block { width: 100%; }
.btn .arr { transition: transform .3s var(--ease); }
@media (hover: hover) and (pointer: fine) {
  .btn:hover { background: var(--ink); color: var(--ivory); }
  .btn--solid:hover { background: var(--bronze-deep); border-color: var(--bronze-deep); }
  .btn--light:hover { background: var(--ivory); color: var(--ink); border-color: var(--ivory); }
  .btn:hover .arr { transform: translateX(4px); }
}
html[lang="hy"] .btn, html[lang="ru"] .btn { letter-spacing: .08em; }

.tel { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-size: 1.08rem; padding: 8px 0; background: linear-gradient(var(--bronze), var(--bronze)) 0 100% / 100% 1px no-repeat; }
.tel svg { color: var(--bronze); }
.more { display: inline-flex; align-items: center; gap: 10px; color: var(--bronze-deep); text-decoration: none; font: 500 .82rem/1.2 var(--text); letter-spacing: .14em; text-transform: uppercase; padding: 8px 0; }
.more .arr { transition: transform .3s var(--ease); }
@media (hover: hover) and (pointer: fine) { .more:hover .arr { transform: translateX(5px); } }
.textbtn { appearance: none; border: 0; background: none; padding: 8px 0; font: inherit; color: var(--bronze-deep); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
.todo { border-bottom: 1px dotted var(--bronze); color: var(--bronze-deep); }

/* ---------- Franja superior ---------- */
.util { border-bottom: 1px solid var(--line); font-size: .8125rem; letter-spacing: .08em; }
.util__in { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 42px; }
.util__contact { display: flex; align-items: center; gap: 22px; color: var(--ink-2); min-width: 0; }
.util__contact a { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; white-space: nowrap; }
.util__contact svg { width: 15px; height: 15px; color: var(--bronze); }
.util__hours { white-space: nowrap; }
.lang { --lp: 11px; --ls: .14em; display: flex; align-items: center; }
.lang button { appearance: none; position: relative; display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 12px var(--lp); font: inherit; letter-spacing: var(--ls); color: var(--ink-3); cursor: pointer; }
.flag { flex: none; width: 18px; height: 12px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(38, 35, 33, .18); opacity: .82; transition: opacity .15s ease; }
.lang button:hover .flag, .lang button[aria-pressed="true"] .flag { opacity: 1; }
/* En el escritorio el selector sale un poco de la columna hacia la derecha, sin acercarse al borde de la pantalla */
.util .lang { margin-right: calc(-1 * var(--lp) - clamp(0px, (100vw - 1200px) / 2 - 32px, 72px)); }
.lang button + button::before { content: ""; position: absolute; left: 0; top: 50%; width: 1px; height: 12px; background: var(--line-strong); transform: translateY(-50%); }
.lang button[aria-pressed="true"] { color: var(--ink); }
.lang button[aria-pressed="true"]::after { content: ""; position: absolute; left: var(--lp); right: calc(var(--lp) + var(--ls)); bottom: 8px; height: 1px; background: var(--bronze); }
/* Cinco idiomas en pantallas estrechas: se aprieta el selector y, en las más pequeñas, el teléfono queda en su icono */
/* Con las banderas el selector ocupa más: por debajo de este ancho el horario cede el sitio (sigue en el pie y en Contacto) */
@media (max-width: 979px) { .util__hours { display: none; } }
/* En el móvil, solo las banderas: el nombre del idioma sigue en la etiqueta accesible de cada botón */
@media (max-width: 560px) {
  .util .lang { --lp: 8px; margin-right: -8px; }
  .util .lang button span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .util .lang button[aria-pressed="true"]::after { right: var(--lp); }
  .util .lang .flag { width: 21px; height: 14px; }
  .util__in { gap: 10px; }
}
@media (max-width: 350px) { .util__contact a span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; } .util__contact a { padding: 10px 6px 10px 0; } }

/* ---------- Cabecera de marca (portada) ---------- */
.mast { position: relative; isolation: isolate; overflow: hidden; text-align: center; padding: clamp(26px, 3.6vw, 46px) 0 clamp(26px, 3.2vw, 40px);
  background: radial-gradient(70% 120% at 100% 0%, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0) 62%); }
body[data-kind="inner"] .mast { display: none; }
.mast__col { position: absolute; left: 0; top: 0; z-index: -1; height: 100%; width: min(27vw, 340px); object-fit: cover; object-position: left top; mix-blend-mode: multiply; opacity: .92; pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, #000 35%, transparent 98%); mask-image: linear-gradient(to right, #000 35%, transparent 98%); }
.mono { display: flex; align-items: center; justify-content: center; gap: clamp(18px, 6vw, 74px); }
.mono__line { width: clamp(40px, 11vw, 136px); height: 1px; background: var(--line-strong); }
.mono__mark { position: relative; display: inline-block; padding-bottom: .16em; font: 500 clamp(3.3rem, 7.2vw, 5.6rem)/.86 var(--display); letter-spacing: .01em; }
.mono__mark span, .brand__mono { background: linear-gradient(165deg, #6B4E36 5%, #A88565 52%, #7C5B3F 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.mono__mark svg { position: absolute; left: -8%; bottom: -.04em; width: 122%; height: .2em; fill: #94714F; }
.mast__name { margin: .32em 0 0; padding-left: .17em; font: 500 clamp(1.45rem, 5.6vw, 4.4rem)/1.05 var(--display); letter-spacing: .17em; text-transform: uppercase; }
.mast__role { margin: .95em 0 0; padding-left: .34em; font: 500 clamp(.66rem, 1.55vw, 1.12rem)/1.4 var(--text); letter-spacing: .34em; text-transform: uppercase; }
.mast__tag { margin: 1.5em 0 0; padding-left: .34em; font: 500 clamp(.58rem, 1.08vw, .82rem)/1.4 var(--text); letter-spacing: .34em; text-transform: uppercase; color: var(--ink-2); }
html[lang="hy"] .mast__role, html[lang="hy"] .mast__tag, html[lang="ru"] .mast__role, html[lang="ru"] .mast__tag { letter-spacing: .22em; padding-left: .22em; }

/* ---------- Barra de navegación ---------- */
.bar-sentinel { height: 1px; margin-bottom: -1px; }
.bar { position: sticky; top: 0; z-index: 60; view-transition-name: site-bar; background: rgba(248, 245, 239, .9); -webkit-backdrop-filter: saturate(1.3) blur(14px); backdrop-filter: saturate(1.3) blur(14px); border-bottom: 1px solid var(--line); }
body[data-kind="home"] .bar { border-top: 1px solid var(--line); }
.bar__in { display: flex; align-items: center; gap: clamp(14px, 2vw, 26px); min-height: var(--bar-h); }
.brand { display: inline-flex; align-items: center; gap: 13px; color: var(--ink); text-decoration: none; white-space: nowrap; overflow: hidden; max-width: 320px; flex: none;
  transition: max-width .5s var(--ease), opacity .3s ease, margin-right .5s var(--ease); }
.brand__mono { font: 500 1.75rem/1 var(--display); padding: 2px 13px 2px 0; border-right: 1px solid var(--line-strong); }
.brand__name { font: 500 .9rem/1 var(--display); letter-spacing: .13em; text-transform: uppercase; }
body[data-kind="home"] .bar:not(.is-stuck) .brand:not(.brand--static) { max-width: 0; opacity: 0; margin-right: calc(-1 * clamp(14px, 2vw, 26px)); }
.bar__nav { flex: 1; min-width: 0; }
.nav { display: flex; gap: clamp(12px, 1.5vw, 24px); list-style: none; margin: 0; padding: 0; }
.nav a { position: relative; display: block; padding: 12px 0; color: var(--ink); text-decoration: none; white-space: nowrap; font: 500 .8125rem/1 var(--text); letter-spacing: .12em; text-transform: uppercase; }
.nav a::after { content: ""; position: absolute; left: 0; right: .12em; bottom: 4px; height: 1px; background: var(--bronze); transform: scaleX(0); transform-origin: left; transition: transform .35s var(--ease); }
.nav a[aria-current="page"] { color: var(--bronze-deep); }
.nav a[aria-current="page"]::after { transform: scaleX(1); }
@media (hover: hover) and (pointer: fine) { .nav a:hover::after { transform: scaleX(1); } }
html[lang="hy"] .nav a, html[lang="ru"] .nav a { letter-spacing: .08em; }
html[lang="hy"] .nav { gap: clamp(12px, 1.5vw, 22px); }
.bar__cta { min-height: 42px; padding: 0 .95em; font-size: .76rem; flex: none; }
.bar__menu { appearance: none; display: none; align-items: center; gap: 10px; margin-left: auto; min-height: 44px; padding: 0 2px 0 10px; border: 0; background: none; color: var(--ink); cursor: pointer; font: 500 .8125rem/1 var(--text); letter-spacing: .14em; text-transform: uppercase; }
.bar__menu svg { width: 24px; height: 24px; }

/* El script comprueba si la navegación cabe; si no, primero reduce la marca al monograma y después pasa al menú. */
.bar--tight .brand__name { display: none; }
.bar--tight .brand__mono { padding-right: 0; border-right: 0; }
.bar--menu .bar__nav, .bar--menu .bar__cta { display: none; }
.bar--menu .bar__menu { display: inline-flex; }
@media (max-width: 1023px) {
  .bar__nav, .bar__cta { display: none; }
  .bar__menu { display: inline-flex; }
  .bar .brand__name { display: inline; }
  .bar .brand__mono { padding-right: 13px; border-right: 1px solid var(--line-strong); }
  .bar .brand { flex: 0 1 auto; min-width: 0; }
  :root { --bar-h: 58px; }
}
@media (max-width: 419px) { .bar .bar__menu span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; } }

/* ---------- Menú móvil ---------- */
.menu { position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; overflow: auto; padding: 5px var(--gutter) 28px; background: var(--ivory); opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility 0s linear .2s; }
.menu.is-open { opacity: 1; visibility: visible; transition: opacity .22s ease; }
.menu__top { display: flex; align-items: center; justify-content: space-between; min-height: 58px; }
.menu__top .bar__menu { display: inline-flex; }
.menu nav { margin-top: 10px; border-top: 1px solid var(--line); }
.menu nav a { display: block; padding: 11px 0; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; font: italic 500 calc(var(--k) * clamp(1.8rem, 7.5vw, 2.5rem))/1.15 var(--display); }
.menu nav a[aria-current="page"] { color: var(--bronze-deep); }
.menu__foot { display: grid; gap: 12px; margin-top: auto; padding-top: 22px; }
.menu__foot .lang { --lp: 9px; justify-content: center; font-size: .9rem; letter-spacing: .08em; }

/* ---------- Acciones fijas en móvil ---------- */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 55; display: none; grid-template-columns: 1fr 1.5fr; gap: 10px; padding: 10px var(--gutter); background: rgba(248, 245, 239, .95); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.dock .btn { min-height: 48px; padding: 0 .8em; font-size: .76rem; letter-spacing: .1em; }
@media (max-width: 719px) {
  .dock { display: grid; }
  body { padding-bottom: 69px; }
  body[data-route="reserva"] { padding-bottom: 0; }
  body[data-route="reserva"] .dock { display: none; }
}

/* ---------- Portada: imagen principal ---------- */
.hero { position: relative; isolation: isolate; overflow: hidden; max-width: 1760px; margin-inline: auto; }
.hero__media { position: absolute; inset: 0 0 0 auto; z-index: -1; width: min(64%, 1060px); }
.hero__media img { width: 100%; height: 100%; object-fit: cover; object-position: 42% 28%; }
.hero__media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--ivory) 0%, rgba(248, 245, 239, .86) 13%, rgba(248, 245, 239, 0) 46%); }
.hero__in { display: flex; align-items: center; min-height: clamp(500px, 44vw, 670px); padding-block: clamp(44px, 6vw, 84px); }
.hero__copy { width: min(540px, 47%); }
html[lang="hy"] .hero__copy, html[lang="ru"] .hero__copy { width: min(580px, 48%); }
.hero .rule { margin: clamp(22px, 2.6vw, 34px) 0; }
.hero__lead { margin: 0; max-width: 28em; font-size: clamp(1.12rem, 1.45vw, 1.3rem); line-height: 1.55; color: var(--ink-2); }
.hero__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 30px; margin-top: clamp(26px, 3vw, 38px); }
@media (max-width: 859px) {
  .hero__media { position: relative; inset: auto; width: 100%; aspect-ratio: 5 / 4; }
  .hero__media img { object-position: 38% 22%; }
  .hero__media::after { background: linear-gradient(180deg, rgba(248, 245, 239, 0) 58%, var(--ivory) 100%); }
  .hero__in { min-height: 0; padding-block: 6px clamp(40px, 8vw, 56px); }
  .hero__copy, html[lang="hy"] .hero__copy, html[lang="ru"] .hero__copy { width: 100%; }
}

/* ---------- Portada: tres datos ---------- */
.facts { border-block: 1px solid var(--line); background: var(--porcelain); }
.facts__grid { display: grid; grid-template-columns: repeat(3, 1fr); }
.fact { padding: clamp(22px, 2.6vw, 34px) clamp(16px, 2.6vw, 40px); }
.fact:first-child { padding-left: 0; }
.fact:last-child { padding-right: 0; }
.fact + .fact { border-left: 1px solid var(--line); }
.fact__t { font: 500 calc(var(--k) * 1.45rem)/1.2 var(--display); }
.fact__d { margin: .35em 0 0; font-size: 1.05rem; line-height: 1.45; color: var(--ink-2); }
@media (max-width: 759px) {
  .facts__grid { grid-template-columns: 1fr; }
  .fact, .fact:first-child, .fact:last-child { padding: 18px 0; }
  .fact + .fact { border-left: 0; border-top: 1px solid var(--line); }
}

/* ---------- Portada: especialidades ---------- */
.areas { display: grid; grid-template-columns: repeat(6, 1fr); row-gap: clamp(28px, 3.4vw, 48px); margin-top: clamp(34px, 4.6vw, 62px); }
.area { position: relative; display: flex; flex-direction: column; align-items: center; gap: 13px; padding: 6px 10px; text-align: center; color: var(--ink); text-decoration: none; font-size: calc(var(--k) * 1.14rem + (1 - var(--k)) * .5rem); line-height: 1.22; }
.area::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
.area svg { width: 40px; height: 40px; color: var(--bronze); transition: transform .35s var(--ease); }
.area { min-width: 0; }
.area span { max-width: 10em; text-wrap: balance; transition: color .2s ease; }

.card { padding: clamp(20px, 2.6vw, 34px); border: 1px solid var(--line); border-radius: 10px; background: var(--porcelain); box-shadow: 0 40px 70px -50px rgba(64, 46, 30, .45); }

.sum { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 18px; margin: 0 0 22px; padding: 14px 0; border-block: 1px solid var(--line); font-size: 1.03rem; line-height: 1.35; }
.sum dt { color: var(--ink-3); }
.sum dd { margin: 0; text-align: right; }
.sum dd.is-empty { color: var(--ink-3); font-style: italic; }
.field { display: grid; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field label { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.field input, .field select, .field textarea { width: 100%; min-height: 48px; padding: 10px 13px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; color: var(--ink); font: inherit; font-size: 1.06rem; line-height: 1.35; }
.field textarea { min-height: 88px; resize: vertical; }
.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; border-color: var(--ink); }
.field [aria-invalid="true"] { border-color: var(--danger); }
.hint { font-size: .93rem; line-height: 1.4; color: var(--ink-3); }
.err { font-size: .93rem; line-height: 1.35; color: var(--danger); }
.err:empty { display: none; }
.err--form { margin: 0 0 12px; }
.check { display: flex; align-items: flex-start; gap: 10px; margin: 4px 0 16px; font-size: 1rem; line-height: 1.4; cursor: pointer; }
.check input { flex: none; width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ink); }
.check a { color: var(--bronze-deep); text-underline-offset: 3px; }
.done__ic { display: grid; place-items: center; width: 44px; height: 44px; margin-bottom: 14px; border: 1px solid var(--bronze); border-radius: 50%; color: var(--bronze-deep); }
.done p { margin: .5em 0 0; color: var(--ink-2); }
.done__text { margin: 18px 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font: inherit; font-size: 1rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.done__act { display: grid; gap: 10px; }
@media (max-width: 1023px) { .book { grid-template-columns: 1fr; } .card--sticky { position: static; } }
@media (max-width: 599px) {
  .bstep--when, .field-row { grid-template-columns: 1fr; }
  .opts--3 { grid-template-columns: 1fr; }
  .opts--3 .opt { min-height: 0; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .opts--3 .opt svg { margin: 0; }
  .opts--3 .opt small { flex-basis: 100%; padding-left: 34px; }
}

/* Reserva con pago */
.opt__price { margin-top: auto; padding-top: 6px; font: 500 calc(var(--k) * 1.35rem)/1 var(--display); color: var(--bronze-deep); }
.sum .sum__total { padding-top: 9px; margin-top: 3px; border-top: 1px solid var(--line); }
.sum dt.sum__total { margin-right: -18px; padding-right: 18px; align-self: stretch; }
.sum dd.sum__total { font: 500 1.35rem/1.1 var(--display); color: var(--ink); }
.pay-note { margin-top: 12px; text-align: center; }
.policy { margin: 0 0 14px; padding: 10px 12px; border-left: 2px solid var(--bronze-soft); background: #fff; white-space: pre-line; }
.testflag { margin: 14px 0 0; padding: 8px 12px; border: 1px dashed var(--bronze); border-radius: 8px; text-align: center; font-size: .9rem; color: var(--bronze-deep); }
.loading { margin: 0; padding: clamp(40px, 8vw, 90px) 0; text-align: center; color: var(--ink-3); font-style: italic; }
.ret { max-width: 620px; margin-inline: auto; }
.ret > p { margin: .5em 0 0; color: var(--ink-2); }
.ret .sum { margin: 22px 0; }
.ret .done__act { margin-top: 22px; grid-template-columns: 1fr; justify-items: stretch; }
.ret .tel { justify-self: center; }
.done__ic.is-wait { border-color: var(--bronze-soft); }
.btn[disabled] { opacity: .6; cursor: progress; }

/* ---------- Contacto ---------- */
.cgrid { display: grid; grid-template-columns: repeat(4, 1fr); border-block: 1px solid var(--line-strong); }
.ccell { padding: 28px clamp(14px, 2.2vw, 32px); min-width: 0; }
.ccell:first-child { padding-left: 0; }
.ccell:last-child { padding-right: 0; }
.ccell + .ccell { border-left: 1px solid var(--line); }
.ccell svg { width: 22px; height: 22px; color: var(--bronze); }
.ccell h2 { margin: 14px 0 8px; font: 500 .8125rem/1.3 var(--text); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
.ccell a, .ccell p { display: block; margin: 0; color: var(--ink); text-decoration: none; overflow-wrap: anywhere; font: 500 calc(var(--k) * clamp(1.15rem, 1.7vw, 1.38rem))/1.28 var(--display); }
.sedes { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(18px, 3vw, 40px); margin-top: clamp(32px, 4.4vw, 60px); }
.sede { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; min-height: 280px; padding: clamp(22px, 3vw, 40px); border: 1px solid var(--line); border-radius: 10px; background: var(--porcelain); box-shadow: 0 40px 70px -54px rgba(64, 46, 30, .45); }
.sede--soon { background: transparent; border-style: dashed; border-color: var(--line-strong); box-shadow: none; }
.sede__tag { padding: .32em .95em; border: 1px solid var(--bronze-soft); border-radius: 999px; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--bronze-deep); }
.sede h2 { font: italic 500 calc(var(--k) * 2.3rem)/1 var(--display); }
html[lang="hy"] .sede h2 { font-style: normal; }
.sede p { margin: 0; }
.sede__note { color: var(--ink-2); font-size: 1.04rem; line-height: 1.5; max-width: 26em; }
.sede__act { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; padding-top: 12px; }
@media (max-width: 899px) {
  .cgrid { grid-template-columns: 1fr 1fr; }
  .ccell:nth-child(odd) { padding-left: 0; border-left: 0; }
  .ccell:nth-child(even) { padding-right: 0; }
  .ccell:nth-child(n+3) { border-top: 1px solid var(--line); }
  .sedes { grid-template-columns: 1fr; }
  .sede { min-height: 0; }

@media (max-width: 479px) { .cgrid { grid-template-columns: 1fr; } .ccell { padding: 20px 0 !important; border-left: 0 !important; } .ccell + .ccell { border-top: 1px solid var(--line); } }

/* ---------- Textos legales ---------- */
.prose { max-width: 42em; }
.prose h2 { margin: 1.7em 0 .45em; font: 500 1.6rem/1.2 var(--display); }
.prose h2:first-child { margin-top: 0; }
.prose p { color: var(--ink-2); }
.prose__note { padding: 12px 16px; border-left: 2px solid var(--bronze); background: var(--porcelain); }

/* ---------- Movimiento ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes settle { from { opacity: 0; transform: scale(1.035); } }

  .intro .hero__copy > .hero__actions { animation-delay: .44s; }
  ::view-transition-old(root) { animation: vt-out .14s ease both; }
  ::view-transition-new(root) { animation: vt-in .32s var(--ease) both; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; transition-delay: 0s !important; animation-duration: .01ms !important; animation-delay: 0s !important; }
}

  /* ------------------------------------------------------------------
     Reserva de consulta
     Con servidor (IA_CONFIG.api): disponibilidad real y pago por adelantado;
     la hora solo queda reservada cuando el pago se confirma.
     Sin servidor (vista previa): se prepara la solicitud para enviarla por correo.
  ------------------------------------------------------------------ */
  var API = (window.IA_CONFIG && window.IA_CONFIG.api) || null;
  var online = { cfg: null, state: API ? 'idle' : 'none', avail: {}, months: {}, ret: null, busy: false };

  var today = new Date(); today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  var minDate = addDays(today, 1);
  var maxDate = addDays(today, SITE.bookDaysAhead);
  function bookable(d) { var w = d.getDay(); return w !== 0 && w !== 6 && d >= minDate && d <= maxDate; }
  function firstBookable() { var d = minDate; while (!bookable(d)) d = addDays(d, 1); return d; }
  function dayOpen(d) { return API ? Boolean(online.avail[iso(d)]) : bookable(d); }
  function calBounds() {
    return API ? [today, addDays(today, (online.cfg && online.cfg.maxDaysAhead) || SITE.bookDaysAhead)] : [minDate, maxDate];
  }

  function money(cents) {
    var cur = ((online.cfg && online.cfg.currency) || 'eur').toUpperCase();
    try { return new Intl.NumberFormat(loc(), { style: 'currency', currency: cur, minimumFractionDigits: cents % 100 ? 2 : 0 }).format(cents / 100); }
    catch (e) { return (cents / 100) + ' ' + cur; }
  }
  function price() { var b = state.book; return API && online.cfg && b.mode && online.cfg.modes[b.mode] ? online.cfg.modes[b.mode].priceCents : null; }

  function call(method, path, body) {
    return fetch(API + path, {
      method: method,
      headers: body ? { 'content-type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) { var e = new Error(d.error || 'error'); e.code = d.error; e.status = r.status; throw e; }
        return d;
      });
    });
  }

  function loadMonth(y, m) {
    var key = y + '-' + pad(m + 1);
    if (online.months[key]) return Promise.resolve();
    var last = new Date(y, m + 1, 0).getDate();
    return call('GET', '/availability?from=' + key + '-01&to=' + key + '-' + pad(last)).then(function (d) {
      online.months[key] = true;
      Object.keys(d.days).forEach(function (k) { online.avail[k] = d.days[k]; });
    });
  }

  function loadOnline() {
    if (online.state !== 'idle') return;
    online.state = 'loading';
    call('GET', '/config').then(function (cfg) {
      online.cfg = cfg;
      if (!cfg.payments) { online.state = 'off'; return null; }
      var next = new Date(today.getFullYear(), today.getMonth() + 1, 1);
      return loadMonth(today.getFullYear(), today.getMonth())
        .then(function () { return loadMonth(next.getFullYear(), next.getMonth()); })
        .then(function () {
          var b = state.book, days = Object.keys(online.avail).sort();
          var first = days.length ? fromIso(days[0]) : today;
          b.month = { y: first.getFullYear(), m: first.getMonth() };
          if (b.mode && !cfg.modes[b.mode]) b.mode = null;
          if (b.date && !(online.avail[b.date] || []).length) { b.date = null; b.time = null; }
          online.state = 'ready';
        });
    }).catch(function () { online.state = 'error'; }).then(function () {
      if (state.route === 'reserva') paintView();
    });
  }

  function stepHead(n, title) {
    return '<div class="bstep__h"><span class="bstep__n" aria-hidden="true">' + n + '</span><h2 class="bstep__t">' + title + '</h2></div>';
  }

  function calHTML(T) {
    var B = T.book, b = state.book, y = b.month.y, m = b.month.m, lim = calBounds();
    var first = new Date(y, m, 1), off = (first.getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate();
    var prevOff = y === lim[0].getFullYear() && m === lim[0].getMonth();
    var nextOff = y === lim[1].getFullYear() && m === lim[1].getMonth();
    var h = '<div class="cal"><div class="cal__head">' +
      '<button type="button" class="cal__nav" data-cal="-1" aria-label="' + B.prevMonth + '"' + (prevOff ? ' disabled' : '') + '>' + ic('prev', 'ui') + '</button>' +
      '<div class="cal__title" aria-live="polite">' + cap(fmt(first, { month: 'long', year: 'numeric' })) + '</div>' +
      '<button type="button" class="cal__nav" data-cal="1" aria-label="' + B.nextMonth + '"' + (nextOff ? ' disabled' : '') + '>' + ic('next', 'ui') + '</button></div>' +
      '<div class="cal__grid">';
    for (var i = 0; i < 7; i++) h += '<div class="cal__dow">' + fmt(new Date(2024, 0, 1 + i), { weekday: 'short' }).replace('.', '') + '</div>';
    for (i = 0; i < off; i++) h += '<span></span>';
    for (var day = 1; day <= dim; day++) {
      var d = new Date(y, m, day), k = iso(d);
      h += '<button type="button" class="day' + (k === iso(today) ? ' day--today' : '') + '" data-day="' + k + '" aria-pressed="' + (b.date === k) + '"' +
        (dayOpen(d) ? '' : ' disabled') + ' aria-label="' + fmt(d, { weekday: 'long', day: 'numeric', month: 'long' }) + '">' + day + '</button>';
    }
    return h + '</div><p class="note">' + B.todayNote + '</p></div>';
  }

  function slotsHTML(T) {
    var B = T.book, b = state.book;
    if (!b.date) return '<p class="note">' + B.pickDate + '</p>';
    var am = SITE.slotsAm, pm = SITE.slotsPm;
    if (API) {
      var list = online.avail[b.date] || [];
      am = list.filter(function (t) { return t < '14:00'; });
      pm = list.filter(function (t) { return t >= '14:00'; });
    }
    function col(label, list) {
      if (!list.length) return '';
      return '<div class="slots__col"><span class="slots__label">' + label + '</span>' + list.map(function (s) {
        return '<button type="button" class="slot" data-slot="' + s + '" aria-pressed="' + (b.time === s) + '">' + s + '</button>';
      }).join('') + '</div>';
    }
    return '<div class="slots">' + col(B.morning, am) + col(B.afternoon, pm) + '</div>';
  }

  function stepsHTML(T) {
    var B = T.book, b = state.book, n = 0;
    var modes = [['presencial', 'office'], ['video', 'video'], ['telefono', 'phone']].filter(function (m) {
      return !API || (online.cfg && online.cfg.modes[m[0]]);
    });
    var h = '<section class="bstep">' + stepHead(++n, B.sMode) + '<div class="opts opts--' + Math.max(2, modes.length) + '">' +
      modes.map(function (m) {
        var sub = API ? '<small class="opt__price">' + money(online.cfg.modes[m[0]].priceCents) + '</small>' : '';
        return '<button type="button" class="opt" data-mode="' + m[0] + '" aria-pressed="' + (b.mode === m[0]) + '">' + ic(m[1], 'ui') +
          '<b>' + B.modes[m[0]].t + '</b><small>' + B.modes[m[0]].d + '</small>' + sub + '</button>';
      }).join('') + '</div></section>';
    if (b.mode === 'presencial') {
      h += '<section class="bstep">' + stepHead(++n, B.sOffice) + '<div class="opts opts--2">' +
        '<button type="button" class="opt" aria-pressed="true">' + ic('pin', 'ui') + '<b>' + B.officeValencia + '</b><small>' + SITE.street + '</small></button>' +
        '<button type="button" class="opt" disabled>' + ic('pin', 'ui') + '<b>' + B.officeGandia + '</b><small>' + T.common.soon + '</small></button>' +
        '</div></section>';
    }
    h += '<section class="bstep bstep--when"><div>' + stepHead(++n, B.sDate) + calHTML(T) + '</div>' +
      '<div>' + stepHead(++n, B.sTime) + slotsHTML(T) + '</div></section>';
    state.book.dataStep = n + 1;
    return h;
  }

  function whenText(isoDay) {
    var d = isoDay || state.book.date;
    return d ? cap(fmt(fromIso(d), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })) : '';
  }

  function sumHTML(T) {
    var B = T.book, b = state.book, p = price();
    function row(k, v) { return '<dt>' + k + '</dt><dd' + (v ? '' : ' class="is-empty"') + '>' + (v || B.none) + '</dd>'; }
    return row(B.sMode, b.mode ? B.modes[b.mode].t : '') +
      (b.mode === 'presencial' ? row(B.sOffice, B.officeValencia) : '') +
      row(B.sDate, whenText()) + row(B.sTime, b.time || '') +
      (API ? '<dt class="sum__total">' + B.price + '</dt><dd class="sum__total' + (p ? '' : ' is-empty') + '">' + (p ? money(p) : B.none) + '</dd>' : '');
  }

  function payLabel(T) { var p = price(); return T.book.pay + (p ? ' · ' + money(p) : ''); }

  function requestText(T) {
    var B = T.book, b = state.book, f = b.form, L = [];
    L.push(B.mailSubject);
    L.push(B.sMode + ': ' + B.modes[b.mode].t + (b.mode === 'presencial' ? ' · ' + B.officeValencia : ''));
    L.push(B.sDate + ': ' + whenText());
    L.push(B.sTime + ': ' + b.time);
    L.push(B.fName + ': ' + f.name);
    L.push(B.fPhone + ': ' + f.phone);
    L.push(B.fEmail + ': ' + f.email);
    if (f.clang) L.push(B.fLang + ': ' + SITE.langNames[f.clang]);
    if (f.msg) L.push(B.fMsg.replace(/\s*\(.*\)/, '') + ': ' + f.msg);
    return L.join('\n');
  }

  function sideHTML(T) {
    var B = T.book, b = state.book, f = b.form;
    if (!API && b.done) {
      var text = requestText(T);
      return '<div class="card card--sticky done"><span class="done__ic">' + ic('check', 'ui') + '</span>' +
        '<h2 class="bstep__t" id="done-title" tabindex="-1">' + B.doneTitle + '</h2><p>' + B.doneText + '</p>' +
        '<pre class="done__text" id="done-text">' + esc(text) + '</pre>' +
        '<div class="done__act"><a class="btn btn--solid" href="mailto:' + SITE.email + '?subject=' + encodeURIComponent(B.mailSubject) + '&body=' + encodeURIComponent(text) + '">' + ic('mail', 'ui') + '<span>' + B.send + '</span></a>' +
        '<button type="button" class="btn" data-copy>' + B.copy + '</button></div>' +
        '<p class="note">' + SITE.email + ' · ' + SITE.phone + '</p>' +
        '<button type="button" class="textbtn" data-edit>' + B.edit + '</button></div>';
    }
    function field(id, label, input, extra) {
      return '<div class="field"><label for="' + id + '">' + label + '</label>' + input + (extra || '') + '<span class="err" id="' + id + '-err" role="alert"></span></div>';
    }
    var tail = API
      ? '<label class="check"><input id="bk-terms" name="terms" type="checkbox"' + (f.terms ? ' checked' : '') + '><span>' + B.terms + '</span></label>' +
        (online.cfg.policy ? '<p class="note policy">' + esc(online.cfg.policy) + '</p>' : '') +
        '<p class="err err--form" id="bk-form-err" role="alert"></p>' +
        '<button class="btn btn--solid btn--block" type="submit" id="bk-submit"><span id="pay-label">' + payLabel(T) + '</span>' + arrow() + '</button>' +
        '<p class="note pay-note">' + B.payNote + '</p>' +
        (online.cfg.test ? '<p class="testflag">' + B.testMode + '</p>' : '')
      : '<p class="err err--form" id="bk-form-err" role="alert"></p>' +
        '<button class="btn btn--solid btn--block" type="submit"><span>' + B.submit + '</span>' + arrow() + '</button>';
    return '<form class="card card--sticky" id="book-form" novalidate>' +
      '<div class="bstep__h"><span class="bstep__n" id="data-n" aria-hidden="true">' + b.dataStep + '</span><h2 class="bstep__t">' + B.sData + '</h2></div>' +
      '<dl class="sum" id="book-sum" aria-label="' + B.sumTitle + '">' + sumHTML(T) + '</dl>' +
      field('bk-name', B.fName, '<input id="bk-name" name="name" type="text" autocomplete="name" value="' + esc(f.name) + '">') +
      '<div class="field-row">' +
      field('bk-phone', B.fPhone, '<input id="bk-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" value="' + esc(f.phone) + '">') +
      field('bk-email', B.fEmail, '<input id="bk-email" name="email" type="email" autocomplete="email" value="' + esc(f.email) + '">') +
      '</div>' +
      field('bk-lang', B.fLang, '<select id="bk-lang" name="clang">' + SITE.consultLangs.map(function (l) {
        return '<option value="' + l + '"' + ((f.clang || consultLang()) === l ? ' selected' : '') + '>' + SITE.langNames[l] + '</option>';
      }).join('') + '</select>') +
      field('bk-msg', B.fMsg, '<textarea id="bk-msg" name="msg" rows="3">' + esc(f.msg) + '</textarea>', '<span class="hint">' + B.msgHint + '</span>') +
      (API ? '<div class="field-row field-row--bill">' +
        field('bk-tax', B.fTax, '<input id="bk-tax" name="tax" type="text" autocomplete="off" maxlength="20" value="' + esc(f.tax || '') + '">') +
        field('bk-addr', B.fAddr, '<input id="bk-addr" name="addr" type="text" autocomplete="street-address" maxlength="300" value="' + esc(f.addr || '') + '">') +
        '</div><p class="note inv-note">' + B.invHint + '</p>' : '') +
      '<label class="check"><input id="bk-ok" name="ok" type="checkbox"' + (f.ok ? ' checked' : '') + '><span>' + B.consent + '</span></label>' +
      tail + '</form>';
  }

  /* Vuelta desde la página de pago */
  function returnHTML(T) {
    var B = T.book, r = online.ret, d = r.data || {};
    function box(icon, title, text, extra) {
      return '<div class="card ret"><span class="done__ic' + (icon === 'clock' ? ' is-wait' : '') + '">' + ic(icon, 'ui') + '</span>' +
        '<h2 class="bstep__t" id="ret-title" tabindex="-1">' + title + '</h2><p>' + text + '</p>' + (extra || '') + '</div>';
    }
    var again = '<div class="done__act"><button type="button" class="btn btn--solid" data-again>' + B.again + '</button>' +
      '<a class="tel" href="' + SITE.tel + '">' + ic('phone', 'ui') + '<span>' + SITE.phone + '</span></a></div>';
    if (r.type === 'check') return box('clock', B.checkTitle, B.checkText);
    if (r.type === 'ok') {
      return box('check', B.okTitle, B.okText,
        '<dl class="sum"><dt>' + B.ref + '</dt><dd>' + esc(d.ref) + '</dd>' +
        '<dt>' + B.sMode + '</dt><dd>' + B.modes[d.mode].t + '</dd>' +
        '<dt>' + B.sDate + '</dt><dd>' + whenText(d.day) + '</dd>' +
        '<dt>' + B.sTime + '</dt><dd>' + esc(d.time) + '</dd>' +
        '<dt class="sum__total">' + B.price + '</dt><dd class="sum__total">' + money(d.amount_cents) + '</dd></dl>' +
        '<div class="done__act"><button type="button" class="btn btn--solid" data-ics>' + ic('calendar', 'ui') + '<span>' + B.addCal + '</span></button>' +
        '<a class="btn" href="#inicio">' + T.nav.home + '</a></div>');
    }
    if (r.type === 'conflict') return box('clock', B.conflictTitle, B.conflictText, again);
    if (r.type === 'cancel') return box('close', B.cancelTitle, B.cancelText, again);
    return box('clock', B.pendingTitle, B.pendingText, '<div class="done__act"><a class="tel" href="' + SITE.tel + '">' + ic('phone', 'ui') + '<span>' + SITE.phone + '</span></a></div>');
  }

  function pollStatus() {
    var r = online.ret;
    function repaint() { if (state.route === 'reserva') paintView(); }
    call('GET', '/bookings/status?session_id=' + encodeURIComponent(r.session)).then(function (d) {
      r.data = d;
      if (d.status === 'confirmed') r.type = 'ok';
      else if (d.status === 'refunded') r.type = 'conflict';
      else if (d.status === 'hold' && r.tries++ < 20) { window.setTimeout(pollStatus, 2000); return; }
      else r.type = 'pending';
      repaint();
    }).catch(function () {
      if (r.tries++ < 5) window.setTimeout(pollStatus, 2500);
      else { r.type = 'pending'; repaint(); }
    });
  }

  function readReturn() {
    if (!API) return;
    var p;
    try { p = new URLSearchParams(window.location.search); } catch (e) { return; }
    var pago = p.get('pago');
    if (!pago) return;
    if (pago === 'ok' && p.get('session_id')) {
      online.ret = { type: 'check', session: p.get('session_id'), tries: 0 };
      pollStatus();
    } else if (pago === 'cancelado') {
      online.ret = { type: 'cancel' };
      if (p.get('rid') && p.get('k')) call('POST', '/bookings/release', { id: p.get('rid'), key: p.get('k') }).catch(function () {});
    }
    try { window.history.replaceState(null, '', window.location.pathname + '#reserva'); } catch (e) { /* la dirección se queda como está */ }
  }

  function downloadIcs() {
    var d = online.ret && online.ret.data; if (!d) return;
    function stamp(x) { return x.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
    var start = new Date(d.starts_at), end = new Date(start.getTime() + (d.durationMin || 60) * 60000), T = tr();
    var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Irina Aharonyan//Reservas//ES', 'BEGIN:VEVENT',
      'UID:' + d.ref + '@irinaaharonyan.es', 'DTSTAMP:' + stamp(new Date()), 'DTSTART:' + stamp(start), 'DTEND:' + stamp(end),
      'SUMMARY:' + T.book.icsTitle, 'DESCRIPTION:' + T.book.ref + ' ' + d.ref + ' · ' + T.book.modes[d.mode].t + ' · ' + SITE.phone,
      'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
      a.download = 'consulta-' + d.ref + '.ics';
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { /* sin descarga disponible */ }
  }

  function vBook(T) {
    var B = T.book, b = state.book;
    function shell(lead, inner) { return pageHead(B.title, lead) + '<section class="section"><div class="wrap">' + inner + '</div></section>'; }
    if (API) {
      if (online.ret) return shell('', returnHTML(T));
      if (online.state === 'idle') loadOnline();
      if (online.state === 'idle' || online.state === 'loading') return shell(B.lead, '<p class="loading" role="status">' + B.loading + '</p>');
      if (online.state !== 'ready') {
        return shell('', '<div class="card ret"><h2 class="bstep__t">' + B.offTitle + '</h2><p>' + B.offText + '</p>' +
          '<div class="done__act"><a class="btn btn--solid" href="' + SITE.tel + '">' + ic('phone', 'ui') + '<span>' + SITE.phone + '</span></a>' +
          '<a class="btn" href="mailto:' + SITE.email + '">' + ic('mail', 'ui') + '<span>' + SITE.email + '</span></a></div></div>');
      }
    }
    if (!b.month) { var f = firstBookable(); b.month = { y: f.getFullYear(), m: f.getMonth() }; }
    var steps = stepsHTML(T);
    return pageHead(B.title, B.lead) +
      '<section class="section"><div class="wrap book"><div id="book-steps">' + steps + '</div><div id="book-side">' + sideHTML(T) + '</div></div></section>';
  }

  function refreshSteps() {
    var el = $('#book-steps'); if (!el) return;
    el.innerHTML = stepsHTML(tr());
    var n = $('#data-n'); if (n) n.textContent = state.book.dataStep;
    var s = $('#book-sum'); if (s) s.innerHTML = sumHTML(tr());
    var p = $('#pay-label'); if (p) p.textContent = payLabel(tr());
    if (state.book.done) { var side = $('#book-side'); if (side) side.innerHTML = sideHTML(tr()); }
  }

  function readForm() {
    var f = state.book.form, g = function (id) { return $('#' + id); };
    if (!g('bk-name')) return;
    f.name = g('bk-name').value.trim();
    f.phone = g('bk-phone').value.trim();
    f.email = g('bk-email').value.trim();
    f.clang = g('bk-lang').value;
    f.msg = g('bk-msg').value.trim();
    if (g('bk-tax')) { f.tax = g('bk-tax').value.trim(); f.addr = g('bk-addr').value.trim(); }
    f.ok = g('bk-ok').checked;
    if (g('bk-terms')) f.terms = g('bk-terms').checked;
  }

  function submitBooking() {
    var B = tr().book, b = state.book, f = b.form, firstBad = null;
    readForm();
    function set(id, msg) {
      var e = $('#' + id + '-err'), inp = $('#' + id);
      if (e) e.textContent = msg || '';
      if (inp) { if (msg) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid'); }
      if (msg && !firstBad) firstBad = inp;
    }
    set('bk-name', f.name.length < 3 ? B.eName : '');
    set('bk-phone', f.phone.replace(/\D/g, '').length < 9 ? B.ePhone : '');
    set('bk-email', /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email) ? '' : B.eEmail);
    if ($('#bk-tax')) set('bk-tax', !f.tax || /^[A-Za-z0-9]{7,15}$/.test(f.tax.replace(/[\s.-]/g, '')) ? '' : B.eTax);
    var formErr = '', focusId = null;
    if (!b.mode || !b.date || !b.time) formErr = B.eWhen;
    else if (!f.ok) { formErr = B.eConsent; focusId = 'bk-ok'; }
    else if (API && !f.terms) { formErr = B.eTerms; focusId = 'bk-terms'; }
    var errBox = $('#bk-form-err');
    errBox.textContent = formErr;
    if (firstBad) { firstBad.focus(); return; }
    if (formErr) { if (focusId) $('#' + focusId).focus(); return; }

    if (!API) {
      b.done = true;
      $('#book-side').innerHTML = sideHTML(tr());
      var t = $('#done-title'); if (t) t.focus({ preventScroll: true });
      var side = $('#book-side'), top = side.getBoundingClientRect().top;
      if (top < 0 || top > window.innerHeight * 0.6) side.scrollIntoView({ block: 'start', behavior: 'auto' });
      return;
    }

    if (online.busy) return;
    online.busy = true;
    var btn = $('#bk-submit'), label = $('#pay-label');
    btn.disabled = true; label.textContent = B.going;
    call('POST', '/bookings', {
      day: b.date, time: b.time, mode: b.mode, name: f.name, phone: f.phone, email: f.email,
      lang: f.clang || consultLang(), note: f.msg, taxId: f.tax || '', billAddress: f.addr || '', consent: true, terms: true
    }).then(function (d) {
      window.location.href = d.url;
    }).catch(function (e) {
      online.busy = false;
      btn.disabled = false; label.textContent = payLabel(tr());
      errBox.textContent = e.code === 'slot_taken' ? B.eTaken : e.code === 'too_many_holds' ? B.eBusy : e.status ? B.ePay : B.eNet;
      if (e.code === 'slot_taken') {
        online.months = {}; online.avail = {}; b.time = null;
        loadMonth(b.month.y, b.month.m).then(function () {
          if (!(online.avail[b.date] || []).length) b.date = null;
          refreshSteps();
        }).catch(function () {});
      }
    });
  }

  /* ------------------------------------------------------------------
     Enrutado y pintado
  ------------------------------------------------------------------ */
  var VIEWS = {
    'inicio': vHome, 'sobre-mi': vAbout, 'especialidades': vAreas, 'metodologia': vMethod,
    'publicaciones': vPubs, 'reserva': vBook, 'contacto': vContact
  };

  function parseRoute() {
    var h = (window.location.hash || '').replace(/^#/, '');
    if (VIEWS[h] || areaIndex(h) > -1 || LEGAL.indexOf(h) > -1) return h;
    return 'inicio';
  }

  function titleFor(T, r) {
    var map = { 'sobre-mi': T.about.title, 'especialidades': T.areasPage.title, 'metodologia': T.method.title, 'publicaciones': T.pubs.title, 'reserva': T.book.title, 'contacto': T.contact.title };
    if (r === 'inicio') return SITE.name + ' · ' + T.home.title;
    var name = map[r] || (T.areas[r] && T.areas[r].name) || (I18N.es.legal[r] && I18N.es.legal[r].title) || '';
    return name + ' · ' + SITE.name;
  }

  function paintChrome() {
    var T = tr();
    document.documentElement.lang = tag(state.lang);
    $('#top').innerHTML = topHTML(T);
    $('#bar').innerHTML = barHTML(T);
    $('#menu').innerHTML = menuHTML(T);
    $('#dock').innerHTML = dockHTML(T);
    $('#foot').innerHTML = footHTML(T);
    $('.skip').textContent = T.nav.skip;
  }

  function paintView() {
    var T = tr(), r = state.route, html;
    if (VIEWS[r]) html = VIEWS[r](T);
    else if (areaIndex(r) > -1) html = vArea(T, r);
    else html = vLegal(T, r);
    $('#app').innerHTML = html;
    document.body.setAttribute('data-route', r);
    document.body.setAttribute('data-kind', r === 'inicio' ? 'home' : 'inner');
    document.title = titleFor(T, r);
    var current = areaIndex(r) > -1 ? 'especialidades' : r;
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (a) {
      if (a.getAttribute('data-nav') === current) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }

  function go(opts) {
    var next = parseRoute(), changed = next !== state.route;
    state.route = next;
    closeMenu();
    var run = function () {
      paintView();
      if (!opts || !opts.keepScroll) window.scrollTo(0, 0);
    };
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (changed && document.startViewTransition && !reduce && !state.first) document.startViewTransition(run);
    else run();
    if (changed && !state.first) { var app = $('#app'); app.focus({ preventScroll: true }); }
  }

  function setLang(l) {
    if (!I18N[l] || l === state.lang) return;
    readForm();
    state.lang = l;
    try { window.localStorage.setItem('ia-lang', l); } catch (e) { /* preferencia no guardada */ }
    document.body.classList.remove('intro');
    var open = $('#menu').classList.contains('is-open');
    paintChrome();
    paintView();
    watchBar();
    fitBar();
    if (open) openMenu();
  }

  /* ------------------------------------------------------------------
     Menú móvil y barra fija
  ------------------------------------------------------------------ */
  function setInert(on) {
    ['#top', '#bar', '#app', '#foot', '#dock'].forEach(function (sel) {
      var el = $(sel); if (!el) return;
      if (on) el.setAttribute('inert', ''); else el.removeAttribute('inert');
    });
  }
  function openMenu() {
    $('#menu').classList.add('is-open');
    document.documentElement.classList.add('menu-open');
    setInert(true);
    var b = $('#bar .bar__menu'); if (b) b.setAttribute('aria-expanded', 'true');
    var c = $('#menu [data-menu-close]'); if (c) c.focus({ preventScroll: true });
  }
  function closeMenu(refocus) {
    var m = $('#menu'); if (!m || !m.classList.contains('is-open')) return;
    m.classList.remove('is-open');
    document.documentElement.classList.remove('menu-open');
    setInert(false);
    var b = $('#bar .bar__menu');
    if (b) { b.setAttribute('aria-expanded', 'false'); if (refocus) b.focus({ preventScroll: true }); }
  }

  /* ¿Cabe la navegación? Si no, marca reducida al monograma; si tampoco, menú. */
  function fitBar() {
    var bar = $('#bar'), inn = $('.bar__in', bar);
    if (!inn) return;
    bar.classList.remove('bar--tight', 'bar--menu');
    if (window.innerWidth < 1024) return;
    var cs = window.getComputedStyle(inn);
    var avail = inn.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var gap = parseFloat(cs.columnGap) || 24;
    var brand = $('.brand', bar), items = bar.querySelectorAll('.nav li'), cta = $('.bar__cta', bar);
    function need() {
      var nav = items[items.length - 1].getBoundingClientRect().right - items[0].getBoundingClientRect().left;
      return brand.scrollWidth + nav + cta.offsetWidth + 2 * gap + 6;
    }
    if (need() <= avail) return;
    bar.classList.add('bar--tight');
    if (need() > avail) bar.classList.add('bar--menu');
  }

  var barObserver;
  function watchBar() {
    var s = $('.bar-sentinel'), bar = $('#bar');
    if (!s || !bar || !('IntersectionObserver' in window)) { if (bar) bar.classList.add('is-stuck'); return; }
    if (barObserver) barObserver.disconnect();
    barObserver = new IntersectionObserver(function (en) {
      bar.classList.toggle('is-stuck', !en[0].isIntersecting && en[0].boundingClientRect.top < 0);
    }, { threshold: 0 });
    barObserver.observe(s);
  }

  /* ------------------------------------------------------------------
     Eventos
  ------------------------------------------------------------------ */
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-lang],[data-mode],[data-day],[data-slot],[data-cal],[data-copy],[data-edit],[data-ics],[data-again],[data-menu-close],.bar__menu,a[href^="#"]');
    if (!el) return;
    var b = state.book;
    if (el.hasAttribute('data-lang')) { setLang(el.getAttribute('data-lang')); return; }
    if (el.hasAttribute('data-menu-close')) { closeMenu(true); return; }
    if (el.classList.contains('bar__menu')) { if ($('#menu').classList.contains('is-open')) closeMenu(); else openMenu(); return; }
    if (el.hasAttribute('data-mode')) { b.mode = el.getAttribute('data-mode'); refreshSteps(); focusBack('[data-mode="' + b.mode + '"]'); return; }
    if (el.hasAttribute('data-day')) { b.date = el.getAttribute('data-day'); b.time = null; refreshSteps(); focusBack('[data-day="' + b.date + '"]'); return; }
    if (el.hasAttribute('data-slot')) { b.time = el.getAttribute('data-slot'); refreshSteps(); focusBack('[data-slot="' + b.time + '"]'); return; }
    if (el.hasAttribute('data-cal')) {
      var m = b.month.m + (+el.getAttribute('data-cal')), y = b.month.y;
      if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
      b.month = { y: y, m: m };
      var dir = el.getAttribute('data-cal');
      if (API) loadMonth(y, m).catch(function () {}).then(function () { refreshSteps(); focusBack('[data-cal="' + dir + '"]'); });
      else { refreshSteps(); focusBack('[data-cal="' + dir + '"]'); }
      return;
    }
    if (el.hasAttribute('data-edit')) { b.done = false; $('#book-side').innerHTML = sideHTML(tr()); return; }
    if (el.hasAttribute('data-ics')) { downloadIcs(); return; }
    if (el.hasAttribute('data-again')) {
      online.ret = null; online.months = {}; online.avail = {}; online.state = 'idle'; b.date = null; b.time = null;
      paintView(); return;
    }
    if (el.hasAttribute('data-copy')) {
      var text = $('#done-text').textContent, done = function () { el.textContent = tr().book.copied; };
      try { navigator.clipboard.writeText(text).then(done, selectText); } catch (e) { selectText(); }
      return;
    }
    if (el.matches('a[href^="#"]')) {
      if (el.getAttribute('href') === '#app') { ev.preventDefault(); $('#app').focus(); return; }
      closeMenu();
      if (el.getAttribute('href') === window.location.hash || (el.getAttribute('href') === '#inicio' && !window.location.hash)) {
        window.scrollTo(0, 0);
      }
    }
  });

  function selectText() {
    var pre = $('#done-text'); if (!pre || !window.getSelection) return;
    var r = document.createRange(); r.selectNodeContents(pre);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  function focusBack(sel) {
    var el = $('#book-steps ' + sel);
    if (el && !el.disabled) el.focus({ preventScroll: true });
  }

  document.addEventListener('submit', function (ev) {
    if (ev.target && ev.target.id === 'book-form') { ev.preventDefault(); submitBooking(); }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target && ev.target.closest && ev.target.closest('#book-form')) readForm();
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeMenu(true); });
  window.addEventListener('hashchange', function () { go(); });

  /* ------------------------------------------------------------------
     Arranque
  ------------------------------------------------------------------ */
  readReturn();
  state.route = parseRoute();
  paintChrome();
  paintView();
  watchBar();
  fitBar();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBar);
  var fitTimer;
  window.addEventListener('resize', function () {
    window.clearTimeout(fitTimer);
    fitTimer = window.setTimeout(function () { fitBar(); if (window.innerWidth >= 1024) closeMenu(); }, 120);
  });
  if (state.route === 'inicio') document.body.classList.add('intro');
  state.first = false;
})();

</script>
</body>
</html>
